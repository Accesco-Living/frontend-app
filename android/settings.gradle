pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "com.google.gms.google-services" version "4.4.0" apply false
}

try {
    System.getProperties().remove("ANDROID_PREFS_ROOT")
    def pe = java.lang.Class.forName("java.lang.ProcessEnvironment")
    ["theEnvironment", "theCaseInsensitiveEnvironment", "theUnmanagedEnvironment"].each { fieldName ->
        try {
            def f = pe.getDeclaredField(fieldName)
            f.setAccessible(true)
            def map = f.get(null)
            if (map != null) {
                map.keySet().removeIf { k -> k.toString().equalsIgnoreCase("ANDROID_PREFS_ROOT") }
            }
        } catch (ignored) {}
    }
} catch (ignored) {
}

include ":app"  